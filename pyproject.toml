[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "split3d"
version = "0.1.0"
description = "Coarse semantic part splitting for AI-generated 3D meshes"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2.1,<3",
  "pillow>=11,<13",
  "pygltflib>=1.16,<2",
  "scipy>=1.15,<2",
  "trimesh>=4.8,<5",
]

[project.optional-dependencies]
dev = [
  "basedpyright>=1.31,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]
vision = [
  "torch==2.8.0",
  "transformers>=4.53,<5",
]
hunyuan-mlx = [
  "einops>=0.8,<1",
  "fpsample>=0.3,<1",
  "huggingface-hub>=0.36,<1",
  "hf-xet>=1.1,<2",
  "mlx>=0.28,<1; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "numba>=0.61,<1",
  "omegaconf>=2.3,<3",
  "safetensors>=0.4,<1",
  "scikit-image>=0.25,<1",
  "scikit-learn>=1.7,<2",
]
cuda-reference = [
  "addict>=2.4,<3",
  "fpsample>=0.3,<1",
  "safetensors>=0.4,<1",
  "spconv-cu124==2.3.8; sys_platform == 'win32'",
  "timm>=1.0,<2",
]

[project.scripts]
split3d = "split3d.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/split3d"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src", "tests"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
